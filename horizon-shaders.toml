# Vulpe para Horizon. Estructura: docs/decisiones/0002-estructura-por-funcion.md
# Orden de `shared` = orden de dependencias: matemática → ruido → color → resto del núcleo →
# opciones → adaptadores comunes. Cada etapa añade en `files` su adaptador propio.
schema = 1
id = "vulpe"
name = "Vulpe"
version = "0.1.0"
api = "0.1"
description = "Vulpe para Horizon, escrito en sala limpia."
authors = ["noctivulp-ch"]
license = "GPL-3.0-or-later"
shared = [
    "nucleo/matematica/constantes.wgsl",
    "nucleo/matematica/utilidades.wgsl",
    "nucleo/matematica/proyeccion.wgsl",
    "nucleo/ruido/hash.wgsl",
    "nucleo/ruido/valor.wgsl",
    "nucleo/ruido/fbm.wgsl",
    "nucleo/ruido/tramado.wgsl",
    "nucleo/color/espacios.wgsl",
    "nucleo/color/luminancia.wgsl",
    "nucleo/color/tonemap.wgsl",
    "nucleo/color/gradacion.wgsl",
    "nucleo/color/codificacion.wgsl",
    "nucleo/color/exposicion.wgsl",
    "nucleo/atmosfera/parametros.wgsl",
    "nucleo/atmosfera/geometria.wgsl",
    "nucleo/atmosfera/fase.wgsl",
    "nucleo/atmosfera/medio.wgsl",
    "nucleo/atmosfera/transmitancia.wgsl",
    "nucleo/atmosfera/dispersion.wgsl",
    "nucleo/atmosfera/astros.wgsl",
    "nucleo/atmosfera/tabla.wgsl",
    "nucleo/cielo/estrellas.wgsl",
    "nucleo/cielo/composicion.wgsl",
    "nucleo/cielo/fractal_colocacion.wgsl",
    "nucleo/superficie/datos.wgsl",
    "nucleo/luz/sombras.wgsl",
    "nucleo/volumen/ruido.wgsl",
    "nucleo/volumen/tiempo.wgsl",
    "nucleo/volumen/capas.wgsl",
    "nucleo/volumen/borde.wgsl",
    "opciones/depuracion.wgsl",
    "opciones/imagen.wgsl",
    "opciones/exposicion.wgsl",
    "opciones/cielo.wgsl",
    "opciones/fractal.wgsl",
    "opciones/aurora.wgsl",
    "opciones/luz.wgsl",
    "opciones/sombras.wgsl",
    "opciones/volumen.wgsl",
    "opciones/taa.wgsl",
    "adaptadores/marco.wgsl",
    "adaptadores/atmosfera.wgsl",
    "adaptadores/fractal.wgsl",
    "adaptadores/tiempo.wgsl",
    "adaptadores/ruido.wgsl",
]

[sky]
file = "etapas/cielo.wgsl"
files = [
    "nucleo/cielo/fractal_conjunto.wgsl",
    "nucleo/cielo/fractal_paleta.wgsl",
    "nucleo/cielo/fractal.wgsl",
    "adaptadores/fractal_dibujo.wgsl",
    "adaptadores/cielo.wgsl",
]
name = "Cielo"
clouds = false      # las nubes son del subsistema 05
sun = false         # el disco del sol es nuestro (subsistema 01); la luna la dibuja Horizon
stars = false

[material]
file = "etapas/material.wgsl"
fog = false         # la niebla es nuestra (subsistema 05)
files = [
    "nucleo/superficie/brdf.wgsl",
    "nucleo/superficie/labpbr.wgsl",
    "nucleo/superficie/sss.wgsl",
    "nucleo/superficie/humedad.wgsl",
    "nucleo/superficie/emision.wgsl",
    "nucleo/luz/curvas.wgsl",
    "nucleo/luz/difusa.wgsl",
    "adaptadores/sombras.wgsl",
    "adaptadores/material.wgsl",
]

[shadow]
resolution = 2048
distance = 128.0

[[post]]
file = "etapas/post/01-aurora.wgsl"
files = [
    "nucleo/cielo/fractal_conjunto.wgsl",
    "nucleo/cielo/fractal_paleta.wgsl",
    "nucleo/cielo/fractal.wgsl",
    "nucleo/cielo/aurora_mapa.wgsl",
    "nucleo/volumen/aurora.wgsl",
    "adaptadores/fractal_dibujo.wgsl",
    "adaptadores/aurora.wgsl",
    "adaptadores/aurora_mapa.wgsl",
]
name = "Mapa de la aurora"
output = "mapa_aurora"
scale = 0.25

[[post]]
file = "etapas/post/02-volumen.wgsl"
files = [
    "nucleo/volumen/fase.wgsl",
    "nucleo/volumen/medios.wgsl",
    "nucleo/volumen/aurora.wgsl",
    "nucleo/volumen/raymarch.wgsl",
    "adaptadores/post.wgsl",
    "adaptadores/aurora.wgsl",
    "adaptadores/volumen.wgsl",
]
name = "Volumen"
output = "volumen"
scale = 0.5

[[post]]
file = "etapas/post/03-composicion.wgsl"
files = [
    "nucleo/superficie/brdf.wgsl",
    "nucleo/superficie/reflejo_pantalla.wgsl",
    "nucleo/luz/curvas.wgsl",
    "nucleo/volumen/fase.wgsl",
    "nucleo/volumen/medios.wgsl",
    "nucleo/volumen/aurora.wgsl",
    "nucleo/volumen/raymarch.wgsl",
    "adaptadores/post.wgsl",
    "adaptadores/aurora.wgsl",
    "adaptadores/volumen.wgsl",
    "adaptadores/reflejo.wgsl",
]
name = "Composición"

[[post]]
file = "etapas/post/04-taa.wgsl"
files = ["nucleo/imagen/taa.wgsl", "adaptadores/taa.wgsl"]
name = "TAA"

[[post]]
file = "etapas/post/05-final.wgsl"
files = ["adaptadores/post.wgsl"]
name = "Final"

# --- Opciones -------------------------------------------------------------------------------

[[options]]
id = "taa"
name = "Antialiasing temporal"
description = "Limpia el grano de niebla, nubes, sombras y reflejos promediando fotogramas."
type = "bool"
default = true

[[options]]
id = "taa_nitidez"
name = "Nitidez del TAA"
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "imagen_exposicion"
name = "Exposición"
description = "Pasos de exposición sobre la imagen final (0 neutro)."
type = "float"
default = 0.0
min = -3.0
max = 3.0
step = 0.1

[[options]]
id = "imagen_saturacion"
name = "Saturación"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "imagen_contraste"
name = "Contraste"
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "imagen_tonemap"
name = "Mapeo de tonos"
description = "Cómo se comprimen los brillos por encima de 1."
type = "choice"
values = ["Vulpe", "Reinhard (luminancia)", "ACES", "Reinhard (por canal)"]
default = "Vulpe"

[[options]]
id = "imagen_tramado"
name = "Tramado"
description = "Ruido de un octavo de bit que borra las bandas de los degradados."
type = "bool"
default = true

[[options]]
id = "depuracion_vista"
name = "Vista de depuración"
type = "choice"
values = ["Normal", "Distancia", "Ruido fBm", "Tramado", "Aurora: conos", "Aurora: sin ventana"]
default = "Normal"

[[options]]
id = "cielo_brillo"
name = "Brillo del cielo"
description = "Pasos de brillo de la atmósfera (0 neutro)."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "luna_brillo"
name = "Brillo de la luna"
description = "Pasos de brillo de la luz de luna: noches más oscuras o más claras."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "estrellas"
name = "Estrellas"
type = "bool"
default = true

[[options]]
id = "aurora"
name = "Aurora"
description = "De noche, las figuras del cielo fractal emiten luz dentro de la niebla y abren huecos en ella."
type = "bool"
default = true

[[options]]
id = "aurora_brillo"
name = "Brillo de la aurora"
description = "Ajuste relativo, en %."
type = "float"
default = 0.0
min = -90.0
max = 200.0
step = 5.0

[[options]]
id = "fractal"
name = "Cielo fractal"
description = "Conjuntos de Julia y del Mandelbrot en el cielo de noche."
type = "bool"
default = true

[[options]]
id = "fractal_cambios_noche"
name = "Cambios por noche"
description = "Apagado: el mismo cielo siempre (por mundo, con el mod Vulpe Companion)."
type = "bool"
default = true

[[options]]
id = "fractal_cobertura"
name = "Cobertura del cielo"
description = "Cuánto cielo cubren entre todas: pocas y pequeñas, o figuras que lo llenan."
type = "float"
default = 45.0
min = 5.0
max = 80.0
step = 5.0

[[options]]
id = "fractal_conjuntos"
name = "Máximo de conjuntos"
type = "int"
default = 6
min = 1
max = 8

[[options]]
id = "fractal_semilla"
name = "Semilla"
description = "Rebaraja el reparto."
type = "int"
default = 8
min = 0
max = 15

[[options]]
id = "fractal_paleta"
name = "Paleta"
type = "choice"
values = ["Aurora", "Brasa", "Hielo", "Monocromo", "Del cielo", "Cielo invertido"]
default = "Cielo invertido"

[[options]]
id = "fractal_brillo"
name = "Brillo"
description = "Invisible a la izquierda, foco a la derecha."
type = "float"
default = 40.0
min = 0.0
max = 200.0
step = 5.0

[[options]]
id = "fractal_saturacion"
name = "Saturación"
description = "Gris a la izquierda, carta de ajuste a la derecha."
type = "float"
default = 70.0
min = 0.0
max = 100.0
step = 5.0

[[options]]
id = "luz_cielo"
name = "Brillo de la luz de cielo"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "luz_bloque"
name = "Brillo de la luz de bloque"
description = "Antorchas, lava, linternas."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "luz_minima_cuevas"
name = "Luz mínima en cuevas"
description = "Para distinguir las formas de una cueva sin antorchas."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "sss"
name = "Dispersión bajo la superficie"
description = "Hojas, plantas y nieve que dejan pasar la luz. Lista: por bloque; LabPBR: del paquete de recursos."
type = "choice"
values = ["Apagada", "Lista", "LabPBR", "Ambas"]
default = "Lista"

[[options]]
id = "reflejos_pantalla"
name = "Reflejos de pantalla"
description = "Charcos, metales y superficies lisas reflejan lo que se ve en pantalla."
type = "choice"
values = ["Apagados", "Bajos", "Altos"]
default = "Bajos"

[[options]]
id = "charcos"
name = "Charcos"
type = "choice"
values = ["Charcos y mojado", "Solo charcos", "Solo mojado", "Apagado"]
default = "Charcos y mojado"

[[options]]
id = "sombras_penumbra"
name = "Penumbra"
description = "Básica: borde suave fijo. Variable: dura al pie del objeto, difusa lejos de él."
type = "choice"
values = ["Básica", "Variable"]
default = "Variable"

[[options]]
id = "niebla"
name = "Niebla volumétrica"
type = "bool"
default = true

[[options]]
id = "niebla_pasos"
name = "Calidad de la niebla"
description = "Pasos del rayo."
type = "int"
default = 8
min = 4
max = 16

[[options]]
id = "niebla_cantidad"
name = "Cantidad de niebla"
description = "Multiplica la niebla de cada hora."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "niebla_lluvia"
name = "Niebla con lluvia"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "nubes"
name = "Nubes"
description = "Qué capas de nubes se dibujan."
type = "choice"
values = ["Apagadas", "Todas", "Solo cúmulos", "Solo altoestratos"]
default = "Todas"

[[options]]
id = "nubes_calidad"
name = "Calidad de las nubes"
type = "choice"
values = ["Baja", "Media", "Alta"]
default = "Media"

[[options]]
id = "nubes_sombras"
name = "Sombras de nubes"
type = "float"
default = 100.0
min = 0.0
max = 100.0
step = 5.0

[[textures]]
id = "atmosfera"
file = "texturas/atmosfera.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "ruido2d"
file = "texturas/ruido2d.png"
filter = "linear"
wrap = "repeat"

[[textures]]
id = "ruido3d"
file = "texturas/ruido3d.png"
filter = "nearest"
wrap = "repeat"

[[textures]]
id = "ruido_azul"
file = "texturas/ruido_azul.png"
filter = "nearest"
wrap = "repeat"

[[textures]]
id = "transmitancia"
file = "texturas/transmitancia.png"
filter = "linear"
wrap = "clamp"

# --- Materiales (ids de MaterialInput.material; ver opciones/luz.wgsl) -------------------------

[[materials]]       # hojas: SSS fuerte
id = 1
sprites = ["block/*_leaves"]

[[materials]]       # plantas cruzadas altas, retoños y algas: SSS fuerte
id = 2
sprites = ["block/*_sapling", "block/tall_grass_*", "block/large_fern_*", "block/sunflower_*", "block/lilac_*", "block/rose_bush_*", "block/peony_*", "block/pitcher_plant_*", "block/kelp", "block/kelp_plant", "block/seagrass", "block/tall_seagrass_*", "block/*_propagule*"]

[[materials]]       # hielo compacto: SSS fuerte
id = 3
sprites = ["block/packed_ice", "block/blue_ice"]

[[materials]]       # hierba, helechos, flores, bambú, lianas: SSS medio, cruzadas
id = 4
sprites = ["block/short_grass", "block/grass", "block/fern", "block/dandelion", "block/poppy", "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower", "block/bamboo_stage0", "block/bamboo_*_leaves", "block/vine", "block/*_vines", "block/*_vines_plant", "block/*_roots", "block/sugar_cane", "block/sweet_berry_bush_*", "block/dead_bush", "block/*_fungus", "block/hanging_roots", "block/cave_vines*"]

[[materials]]       # liquen, pétalos, cogollos de amatista: SSS medio
id = 5
sprites = ["block/glow_lichen", "block/pink_petals*", "block/*_amethyst_bud", "block/amethyst_cluster", "block/moss_carpet"]

[[materials]]       # nieve, amatista, telaraña, coral, champiñón: SSS débil
id = 6
sprites = ["block/snow", "block/powder_snow", "block/amethyst_block", "block/cobweb", "block/*coral*", "block/*_mushroom_block", "block/mushroom_block_inside", "block/mushroom_stem"]

# --- Menú -----------------------------------------------------------------------------------

[[pages]]
id = "principal"
name = "Vulpe"
items = ["page:cielo", "page:fractal", "page:niebla", "page:luz", "page:sombras", "page:imagen", "page:depuracion"]

[[pages]]
id = "cielo"
name = "Cielo"
description = "Atmósfera, sol, luna y estrellas."
items = ["cielo_brillo", "luna_brillo", "estrellas"]

[[pages]]
id = "fractal"
name = "Cielo fractal"
description = "Las constelaciones de fractales de la noche."
items = ["fractal", "fractal_cambios_noche", "fractal_cobertura", "fractal_conjuntos", "fractal_semilla", "fractal_paleta", "fractal_brillo", "fractal_saturacion", "aurora", "aurora_brillo"]

[[pages]]
id = "niebla"
name = "Niebla y nubes"
description = "Niebla volumétrica y nubes."
items = ["niebla", "niebla_pasos", "niebla_cantidad", "niebla_lluvia", "nubes", "nubes_calidad"]

[[pages]]
id = "luz"
name = "Luz"
description = "Cielo, bloques, dispersión, brillos y charcos."
items = ["luz_cielo", "luz_bloque", "luz_minima_cuevas", "sss", "reflejos_pantalla", "charcos"]

[[pages]]
id = "sombras"
name = "Sombras"
description = "Penumbra y sombras de nubes."
items = ["sombras_penumbra", "nubes_sombras"]

[[pages]]
id = "imagen"
name = "Imagen"
description = "Exposición, color y mapeo de tonos."
items = ["taa", "taa_nitidez", "imagen_exposicion", "imagen_saturacion", "imagen_contraste", "imagen_tonemap", "imagen_tramado"]

[[pages]]
id = "depuracion"
name = "Depuración"
description = "Vistas para comprobar el núcleo."
columns = 1
items = ["depuracion_vista"]

[budget]
gpu_ms = 1.0
