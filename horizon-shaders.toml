values = ["Apagadas", "Todas", "Solo cúmulos", "Solo altoestratos"]
default = "Todas"

[[options]]
id = "nubes_calidad"
name = "Calidad de las nubes"
type = "choice"
values = ["Baja", "Media", "Alta"]
default = "Media"

[[options]]
id = "nubes_sombras"
name = "Sombras de nubes"
type = "float"
default = 100.0
min = 0.0
max = 100.0
step = 5.0

