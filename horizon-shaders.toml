# Vulpe para Horizon. Estructura: docs/decisiones/0002-estructura-por-funcion.md
# Orden de `shared` = orden de dependencias: matemática → ruido → color → resto del núcleo →
# opciones → adaptadores comunes. Cada etapa añade en `files` su adaptador propio.
schema = 1
id = "vulpe"
name = "Vulpe"
version = "0.1.0"
api = "0.1"
description = "Vulpe para Horizon, escrito en sala limpia."
authors = ["noctivulp-ch"]
license = "GPL-3.0-or-later"
shared = [
    "nucleo/matematica/constantes.wgsl",
    "nucleo/matematica/utilidades.wgsl",
    "nucleo/matematica/proyeccion.wgsl",
    "nucleo/ruido/hash.wgsl",
    "nucleo/ruido/valor.wgsl",
    "nucleo/ruido/fbm.wgsl",
    "nucleo/ruido/tramado.wgsl",
    "nucleo/color/espacios.wgsl",
    "nucleo/color/luminancia.wgsl",
    "nucleo/color/tonemap.wgsl",
    "nucleo/color/gradacion.wgsl",
    "nucleo/color/codificacion.wgsl",
    "nucleo/color/exposicion.wgsl",
    "nucleo/atmosfera/parametros.wgsl",
    "nucleo/atmosfera/geometria.wgsl",
    "nucleo/atmosfera/fase.wgsl",
    "nucleo/atmosfera/medio.wgsl",
    "nucleo/atmosfera/transmitancia.wgsl",
    "nucleo/atmosfera/dispersion.wgsl",
    "nucleo/atmosfera/astros.wgsl",
    "nucleo/atmosfera/tabla.wgsl",
    "nucleo/cielo/estrellas.wgsl",
    "nucleo/cielo/composicion.wgsl",
    "opciones/depuracion.wgsl",
    "opciones/imagen.wgsl",
    "opciones/exposicion.wgsl",
    "opciones/cielo.wgsl",
    "adaptadores/marco.wgsl",
    "adaptadores/atmosfera.wgsl",
]

[sky]
file = "etapas/cielo.wgsl"
files = ["adaptadores/cielo.wgsl"]
name = "Cielo"
clouds = false      # las nubes son del subsistema 05
sun = false         # el disco del sol es nuestro (subsistema 01); la luna la dibuja Horizon
stars = false

[material]
file = "etapas/material.wgsl"
files = ["adaptadores/material.wgsl"]

[[post]]
file = "etapas/post/01-final.wgsl"
files = ["adaptadores/post.wgsl"]
name = "Final"

# --- Opciones -------------------------------------------------------------------------------

[[options]]
id = "imagen_exposicion"
name = "Exposición"
description = "Pasos de exposición sobre la imagen final (0 neutro)."
type = "float"
default = 0.0
min = -3.0
max = 3.0
step = 0.1

[[options]]
id = "imagen_saturacion"
name = "Saturación"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "imagen_contraste"
name = "Contraste"
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "imagen_tonemap"
name = "Mapeo de tonos"
description = "Cómo se comprimen los brillos por encima de 1."
type = "choice"
values = ["Vulpe", "Reinhard (luminancia)", "ACES"]
default = "Vulpe"

[[options]]
id = "imagen_tramado"
name = "Tramado"
description = "Ruido de un octavo de bit que borra las bandas de los degradados."
type = "bool"
default = true

[[options]]
id = "depuracion_vista"
name = "Vista de depuración"
type = "choice"
values = ["Normal", "Distancia", "Ruido fBm", "Tramado"]
default = "Normal"

[[options]]
id = "cielo_brillo"
name = "Brillo del cielo"
description = "Pasos de brillo de la atmósfera (0 neutro)."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "cielo_bruma"
name = "Bruma"
description = "Aerosoles: cielo limpio y halo pequeño, o cielo lechoso y halo enorme."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "sol_temperatura"
name = "Temperatura del sol"
description = "Kelvin: anaranjado a la izquierda, blanco azulado a la derecha."
type = "float"
default = 6000.0
min = 4000.0
max = 8000.0
step = 100.0

[[options]]
id = "luna_brillo"
name = "Brillo de la luna"
description = "Pasos de brillo de la luz de luna: noches más oscuras o más claras."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "estrellas"
name = "Estrellas"
type = "bool"
default = true

[[options]]
id = "estrellas_brillo"
name = "Brillo de las estrellas"
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[textures]]
id = "atmosfera"
file = "texturas/atmosfera.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "transmitancia"
file = "texturas/transmitancia.png"
filter = "linear"
wrap = "clamp"

# --- Menú -----------------------------------------------------------------------------------

[[pages]]
id = "principal"
name = "Vulpe"
items = ["page:cielo", "page:imagen", "page:depuracion"]

[[pages]]
id = "cielo"
name = "Cielo"
description = "Atmósfera, sol, luna y estrellas."
items = ["cielo_brillo", "cielo_bruma", "sol_temperatura", "luna_brillo", "estrellas", "estrellas_brillo"]

[[pages]]
id = "imagen"
name = "Imagen"
description = "Exposición, color y mapeo de tonos."
items = ["imagen_exposicion", "imagen_saturacion", "imagen_contraste", "imagen_tonemap", "imagen_tramado"]

[[pages]]
id = "depuracion"
name = "Depuración"
description = "Vistas para comprobar el núcleo."
columns = 1
items = ["depuracion_vista"]

[budget]
gpu_ms = 1.0
