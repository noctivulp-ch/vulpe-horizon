default = true

[[options]]
id = "menas_intensidad"
name = "Intensidad de las menas"
type = "float"
default = 60.0
min = 0.0
max = 100.0
step = 5.0

[[options]]
id = "luz_cielo"
name = "Brillo de la luz de cielo"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "luz_bloque"
name = "Brillo de la luz de bloque"
description = "Antorchas, lava, linternas."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "luz_minima_cuevas"
name = "Luz mínima en cuevas"
description = "Para distinguir las formas de una cueva sin antorchas."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "sss"
name = "Dispersión bajo la superficie"
