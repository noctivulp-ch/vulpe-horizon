# Vulpe para Horizon. Estructura: docs/decisiones/0002-estructura-por-funcion.md
# Orden de `shared` = orden de dependencias: matemática → ruido → color → resto del núcleo →
# opciones → adaptadores comunes. Cada etapa añade en `files` su adaptador propio.
schema = 1
id = "vulpe"
name = "Vulpe"
version = "0.1.0"
api = "0.1"
description = "Vulpe para Horizon, escrito en sala limpia."
authors = ["noctivulp-ch"]
license = "GPL-3.0-or-later"
shared = [
    "nucleo/matematica/constantes.wgsl",
    "nucleo/matematica/utilidades.wgsl",
    "nucleo/matematica/proyeccion.wgsl",
    "nucleo/ruido/hash.wgsl",
    "nucleo/ruido/valor.wgsl",
    "nucleo/ruido/fbm.wgsl",
    "nucleo/ruido/tramado.wgsl",
    "nucleo/color/espacios.wgsl",
    "nucleo/color/luminancia.wgsl",
    "nucleo/color/tonemap.wgsl",
    "nucleo/color/gradacion.wgsl",
    "nucleo/color/codificacion.wgsl",
    "nucleo/color/exposicion.wgsl",
    "nucleo/color/purkinje.wgsl",
    "nucleo/atmosfera/parametros.wgsl",
    "nucleo/atmosfera/geometria.wgsl",
    "nucleo/atmosfera/fase.wgsl",
    "nucleo/atmosfera/medio.wgsl",
    "nucleo/atmosfera/transmitancia.wgsl",
    "nucleo/atmosfera/dispersion.wgsl",
    "nucleo/atmosfera/astros.wgsl",
    "nucleo/atmosfera/tabla.wgsl",
    "nucleo/cielo/estrellas.wgsl",
    "nucleo/cielo/composicion.wgsl",
    "nucleo/cielo/fractal_colocacion.wgsl",
    "nucleo/superficie/datos.wgsl",
    "nucleo/luz/sombras.wgsl",
    "nucleo/volumen/ruido.wgsl",
    "nucleo/volumen/tiempo.wgsl",
    "nucleo/volumen/capas.wgsl",
    "nucleo/volumen/borde.wgsl",
    "opciones/calidad.wgsl",
    "opciones/estilo.wgsl",
    "opciones/depuracion.wgsl",
    "opciones/imagen.wgsl",
    "opciones/exposicion.wgsl",
    "opciones/cielo.wgsl",
    "opciones/fractal.wgsl",
    "opciones/aurora.wgsl",
    "opciones/luz.wgsl",
    "opciones/sombras.wgsl",
    "opciones/volumen.wgsl",
    "opciones/tiempo.wgsl",
    "opciones/taa.wgsl",
    "opciones/oclusion.wgsl",
    "opciones/viento.wgsl",
    "adaptadores/marco.wgsl",
    "adaptadores/atmosfera.wgsl",
    "adaptadores/fractal.wgsl",
    "adaptadores/tiempo.wgsl",
    "adaptadores/ruido.wgsl",
]

[sky]
file = "etapas/cielo.wgsl"
files = [
    "nucleo/cielo/fractal_conjunto.wgsl",
    "nucleo/cielo/fractal_paleta.wgsl",
    "nucleo/cielo/fractal.wgsl",
    "adaptadores/fractal_dibujo.wgsl",
    "adaptadores/cielo.wgsl",
]
name = "Cielo"
clouds = false      # las nubes son del subsistema 05
sun = false         # el disco del sol es nuestro (subsistema 01); la luna la dibuja Horizon
stars = false

# Vegetación ondulante (15). Ver docs/efectos/vegetacion-ondulante.md.
[vertex]
file = "etapas/vertice.wgsl"
files = ["nucleo/superficie/viento.wgsl", "adaptadores/vertice.wgsl"]

[weather]           # lluvia y nieve (16)
file = "etapas/clima.wgsl"
files = ["nucleo/luz/curvas.wgsl", "nucleo/volumen/fase.wgsl", "nucleo/volumen/medios.wgsl", "opciones/clima.wgsl", "adaptadores/clima.wgsl"]

[material]
file = "etapas/material.wgsl"
fog = false         # la niebla es nuestra (subsistema 05)
files = [
    "nucleo/agua/optica.wgsl",
    "nucleo/agua/olas.wgsl",
    "opciones/agua.wgsl",
    "nucleo/superficie/estaciones.wgsl",
    "opciones/estaciones.wgsl",
    "nucleo/superficie/brdf.wgsl",
    "nucleo/superficie/labpbr.wgsl",
    "nucleo/superficie/sss.wgsl",
    "nucleo/superficie/humedad.wgsl",
    "nucleo/superficie/emision.wgsl",
    "nucleo/superficie/menas.wgsl",
    "opciones/menas.wgsl",
    "nucleo/superficie/relieve.wgsl",
    "opciones/relieve.wgsl",
    "adaptadores/relieve.wgsl",
    "nucleo/luz/curvas.wgsl",
    "nucleo/luz/difusa.wgsl",
    "adaptadores/sombras.wgsl",
    "adaptadores/material.wgsl",
    "adaptadores/agua.wgsl",
]

[displacement]       # relieve geométrico con teselación (subsistema 18)
distance = 12.0
cells = 16

[reflection]        # el espejo del agua (07): se dibuja siempre que el material lo lee

[shadow]
resolution = 2048
distance = 128.0
resolution_option = "sombras_resolucion"
distance_option = "sombras_distancia"

[[post]]
file = "etapas/post/01-aurora.wgsl"
files = [
    "nucleo/cielo/fractal_conjunto.wgsl",
    "nucleo/cielo/fractal_paleta.wgsl",
    "nucleo/cielo/fractal.wgsl",
    "nucleo/cielo/aurora_mapa.wgsl",
    "nucleo/volumen/aurora.wgsl",
    "adaptadores/fractal_dibujo.wgsl",
    "adaptadores/aurora.wgsl",
    "adaptadores/aurora_mapa.wgsl",
]
name = "Mapa de la aurora"
output = "mapa_aurora"
scale = 0.25

[[post]]
file = "etapas/post/02-volumen.wgsl"
files = [
    "nucleo/agua/optica.wgsl",
    "opciones/agua.wgsl",
    "nucleo/volumen/fase.wgsl",
    "nucleo/volumen/medios.wgsl",
    "nucleo/volumen/aurora.wgsl",
    "nucleo/volumen/raymarch.wgsl",
    "nucleo/volumen/agua.wgsl",
    "nucleo/volumen/dimensiones.wgsl",
    "adaptadores/post.wgsl",
    "opciones/cruce_agua.wgsl",
    "adaptadores/cruce_agua.wgsl",
    "adaptadores/aurora.wgsl",
    "adaptadores/volumen.wgsl",
]
name = "Volumen"
output = "volumen"
scale = 0.5

[[post]]
file = "etapas/post/03-composicion.wgsl"
files = [
    "nucleo/agua/optica.wgsl",
    "opciones/agua.wgsl",
    "nucleo/superficie/brdf.wgsl",
    "nucleo/superficie/reflejo_pantalla.wgsl",
    "nucleo/luz/curvas.wgsl",
    "nucleo/volumen/fase.wgsl",
    "nucleo/volumen/medios.wgsl",
    "nucleo/volumen/aurora.wgsl",
    "nucleo/volumen/raymarch.wgsl",
    "nucleo/volumen/agua.wgsl",
    "nucleo/volumen/dimensiones.wgsl",
    "adaptadores/post.wgsl",
    "opciones/cruce_agua.wgsl",
    "adaptadores/cruce_agua.wgsl",
    "adaptadores/aurora.wgsl",
    "adaptadores/volumen.wgsl",
    "adaptadores/reflejo.wgsl",
    "nucleo/luz/oclusion.wgsl",
    "adaptadores/oclusion.wgsl",
]
name = "Composición"

[[post]]
file = "etapas/post/04-bloom-bajada.wgsl"
files = ["nucleo/imagen/exposicion.wgsl", "nucleo/imagen/bloom.wgsl", "nucleo/imagen/taa.wgsl", "adaptadores/post.wgsl", "opciones/cruce_agua.wgsl", "adaptadores/cruce_agua.wgsl", "adaptadores/imagen.wgsl"]
name = "Bloom: bajada"
output = "bloom"
scale = 0.25

[[post]]
file = "etapas/post/05-bloom-ancho.wgsl"
files = ["nucleo/imagen/exposicion.wgsl", "nucleo/imagen/bloom.wgsl", "nucleo/imagen/taa.wgsl", "adaptadores/post.wgsl", "opciones/cruce_agua.wgsl", "adaptadores/cruce_agua.wgsl", "adaptadores/imagen.wgsl"]
name = "Bloom: ancho"
output = "bloom2"
scale = 0.25

[[post]]
file = "etapas/post/06-taa.wgsl"
files = ["nucleo/imagen/taa.wgsl", "adaptadores/taa.wgsl"]
name = "TAA"

[[post]]
file = "etapas/post/07-final.wgsl"
files = ["nucleo/imagen/exposicion.wgsl", "nucleo/imagen/bloom.wgsl", "nucleo/imagen/taa.wgsl", "nucleo/imagen/nitidez.wgsl", "nucleo/imagen/aislamiento.wgsl", "opciones/aislamiento.wgsl", "nucleo/volumen/fase.wgsl", "nucleo/imagen/rayos.wgsl", "opciones/rayos.wgsl", "adaptadores/post.wgsl", "opciones/cruce_agua.wgsl", "adaptadores/cruce_agua.wgsl", "adaptadores/imagen.wgsl", "adaptadores/rayos.wgsl"]
name = "Final"

# ============================================================================================
# 1. MENÚ DIRECTO (37 OPCIONES, mapa-de-ajustes.md §1)
