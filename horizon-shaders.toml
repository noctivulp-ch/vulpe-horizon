values = ["Apagada", "Lista", "LabPBR", "Ambas"]
default = "Lista"

[[options]]
id = "reflejos_pantalla"
name = "Reflejos de pantalla"
description = "Charcos, metales y superficies lisas reflejan lo que se ve en pantalla."
type = "choice"
values = ["Apagados", "Bajos", "Altos"]
default = "Bajos"

[[options]]
