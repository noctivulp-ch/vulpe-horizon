# Vulpe para Horizon. Estructura: docs/decisiones/0002-estructura-por-funcion.md
# Orden de `shared` = orden de dependencias: matemática → ruido → color → resto del núcleo →
# opciones → adaptadores comunes. Cada etapa añade en `files` su adaptador propio.
schema = 1
id = "vulpe"
name = "Vulpe"
version = "0.1.0"
api = "0.1"
description = "Vulpe para Horizon, escrito en sala limpia."
authors = ["noctivulp-ch"]
license = "GPL-3.0-or-later"
shared = [
    "nucleo/matematica/constantes.wgsl",
    "nucleo/matematica/utilidades.wgsl",
    "nucleo/matematica/proyeccion.wgsl",
    "nucleo/ruido/hash.wgsl",
    "nucleo/ruido/valor.wgsl",
    "nucleo/ruido/fbm.wgsl",
    "nucleo/ruido/tramado.wgsl",
    "nucleo/color/espacios.wgsl",
    "nucleo/color/luminancia.wgsl",
    "nucleo/color/tonemap.wgsl",
    "nucleo/color/gradacion.wgsl",
    "nucleo/color/codificacion.wgsl",
    "nucleo/color/exposicion.wgsl",
    "nucleo/atmosfera/parametros.wgsl",
    "nucleo/atmosfera/geometria.wgsl",
    "nucleo/atmosfera/fase.wgsl",
    "nucleo/atmosfera/medio.wgsl",
    "nucleo/atmosfera/transmitancia.wgsl",
    "nucleo/atmosfera/dispersion.wgsl",
    "nucleo/atmosfera/astros.wgsl",
    "nucleo/atmosfera/tabla.wgsl",
    "nucleo/cielo/estrellas.wgsl",
    "nucleo/cielo/composicion.wgsl",
    "nucleo/cielo/fractal_colocacion.wgsl",
    "nucleo/superficie/datos.wgsl",
    "nucleo/luz/sombras.wgsl",
    "opciones/depuracion.wgsl",
    "opciones/imagen.wgsl",
    "opciones/exposicion.wgsl",
    "opciones/cielo.wgsl",
    "opciones/fractal.wgsl",
    "opciones/luz.wgsl",
    "opciones/sombras.wgsl",
    "adaptadores/marco.wgsl",
    "adaptadores/atmosfera.wgsl",
    "adaptadores/fractal.wgsl",
]

[sky]
file = "etapas/cielo.wgsl"
files = [
    "nucleo/cielo/fractal_conjunto.wgsl",
    "nucleo/cielo/fractal_paleta.wgsl",
    "nucleo/cielo/fractal.wgsl",
    "adaptadores/cielo.wgsl",
]
name = "Cielo"
clouds = false      # las nubes son del subsistema 05
sun = false         # el disco del sol es nuestro (subsistema 01); la luna la dibuja Horizon
stars = false

[material]
file = "etapas/material.wgsl"
files = [
    "nucleo/superficie/brdf.wgsl",
    "nucleo/superficie/labpbr.wgsl",
    "nucleo/superficie/sss.wgsl",
    "nucleo/superficie/humedad.wgsl",
    "nucleo/superficie/emision.wgsl",
    "nucleo/luz/curvas.wgsl",
    "nucleo/luz/difusa.wgsl",
    "adaptadores/sombras.wgsl",
    "adaptadores/material.wgsl",
]

[shadow]
resolution = 2048
distance = 128.0

[[post]]
file = "etapas/post/01-final.wgsl"
files = ["adaptadores/post.wgsl"]
name = "Final"

# --- Opciones -------------------------------------------------------------------------------

[[options]]
id = "imagen_exposicion"
name = "Exposición"
description = "Pasos de exposición sobre la imagen final (0 neutro)."
type = "float"
default = 0.0
min = -3.0
max = 3.0
step = 0.1

[[options]]
id = "imagen_saturacion"
name = "Saturación"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "imagen_contraste"
name = "Contraste"
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "imagen_tonemap"
name = "Mapeo de tonos"
description = "Cómo se comprimen los brillos por encima de 1."
type = "choice"
values = ["Vulpe", "Reinhard (luminancia)", "ACES", "Reinhard (por canal)"]
default = "Vulpe"

[[options]]
id = "imagen_tramado"
name = "Tramado"
description = "Ruido de un octavo de bit que borra las bandas de los degradados."
type = "bool"
default = true

[[options]]
id = "depuracion_vista"
name = "Vista de depuración"
type = "choice"
values = ["Normal", "Distancia", "Ruido fBm", "Tramado"]
default = "Normal"

[[options]]
id = "cielo_brillo"
name = "Brillo del cielo"
description = "Pasos de brillo de la atmósfera (0 neutro)."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "cielo_bruma"
name = "Bruma"
description = "Aerosoles: cielo limpio y halo pequeño, o cielo lechoso y halo enorme."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "sol_temperatura"
name = "Temperatura del sol"
description = "Kelvin: anaranjado a la izquierda, blanco azulado a la derecha."
type = "float"
default = 6000.0
min = 4000.0
max = 8000.0
step = 100.0

[[options]]
id = "luna_brillo"
name = "Brillo de la luna"
description = "Pasos de brillo de la luz de luna: noches más oscuras o más claras."
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "estrellas"
name = "Estrellas"
type = "bool"
default = true

[[options]]
id = "estrellas_brillo"
name = "Brillo de las estrellas"
type = "float"
default = 0.0
min = -2.0
max = 2.0
step = 0.1

[[options]]
id = "fractal"
name = "Cielo fractal"
description = "Conjuntos de Julia y del Mandelbrot en el cielo de noche."
type = "bool"
default = true

[[options]]
id = "fractal_cambios_noche"
name = "Cambios por noche"
description = "Apagado: el mismo cielo siempre (por mundo, con el mod Vulpe Companion)."
type = "bool"
default = true

[[options]]
id = "fractal_cobertura"
name = "Cobertura del cielo"
description = "Cuánto cielo cubren entre todas: pocas y pequeñas, o figuras que lo llenan."
type = "float"
default = 45.0
min = 5.0
max = 80.0
step = 5.0

[[options]]
id = "fractal_conjuntos"
name = "Máximo de conjuntos"
type = "int"
default = 6
min = 1
max = 8

[[options]]
id = "fractal_semilla"
name = "Semilla"
description = "Rebaraja el reparto."
type = "int"
default = 8
min = 0
max = 15

[[options]]
id = "fractal_paleta"
name = "Paleta"
type = "choice"
values = ["Aurora", "Brasa", "Hielo", "Monocromo", "Del cielo", "Cielo invertido"]
default = "Cielo invertido"

[[options]]
id = "fractal_brillo"
name = "Brillo"
description = "Invisible a la izquierda, foco a la derecha."
type = "float"
default = 40.0
min = 0.0
max = 200.0
step = 5.0

[[options]]
id = "fractal_techo"
name = "Techo"
description = "Acota el pico de brillo (0: sin techo)."
type = "float"
default = 150.0
min = 0.0
max = 200.0
step = 5.0

[[options]]
id = "fractal_saturacion"
name = "Saturación"
description = "Gris a la izquierda, carta de ajuste a la derecha."
type = "float"
default = 70.0
min = 0.0
max = 100.0
step = 5.0

[[options]]
id = "fractal_contraste"
name = "Contraste"
description = "Bajo: color en los filamentos finos. Alto: concentrado."
type = "float"
default = 60.0
min = 0.0
max = 300.0
step = 10.0

[[options]]
id = "fractal_mutacion"
name = "Mutación"
description = "Cuánto respiran las figuras de una noche a otra."
type = "float"
default = 25.0
min = 0.0
max = 100.0
step = 5.0

[[options]]
id = "fractal_hueco"
name = "Hueco de los astros"
description = "Ceñido al disco a la izquierda, cono amplio a la derecha."
type = "float"
default = 40.0
min = 0.0
max = 400.0
step = 10.0

[[options]]
id = "fractal_dibujo"
name = "Dibujo"
description = "Original: las líneas de la cuenta entera. Suave: conteo suavizado."
type = "choice"
values = ["Original", "Suave"]
default = "Original"

[[options]]
id = "luz_cielo"
name = "Brillo de la luz de cielo"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "luz_bloque"
name = "Brillo de la luz de bloque"
description = "Antorchas, lava, linternas."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "luz_bloque_color"
name = "Color de la luz de bloque"
type = "choice"
values = ["Cálido", "Neutro", "Frío"]
default = "Cálido"

[[options]]
id = "luz_minima_cuevas"
name = "Luz mínima en cuevas"
description = "Para distinguir las formas de una cueva sin antorchas."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "luz_minima_exterior"
name = "Luz mínima al aire libre"
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "sss"
name = "Dispersión bajo la superficie"
description = "Hojas, plantas y nieve que dejan pasar la luz. Lista: por bloque; LabPBR: del paquete de recursos."
type = "choice"
values = ["Apagada", "Lista", "LabPBR", "Ambas"]
default = "Lista"

[[options]]
id = "sss_brillo"
name = "Brillo de la dispersión"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "especular_sol"
name = "Brillo especular del sol"
type = "float"
default = 1.0
min = 0.0
max = 10.0
step = 0.25

[[options]]
id = "emision_labpbr"
name = "Brillo de la emisión LabPBR"
type = "float"
default = 1.0
min = 1.0
max = 50.0
step = 1.0

[[options]]
id = "charcos"
name = "Charcos"
type = "choice"
values = ["Charcos y mojado", "Solo charcos", "Solo mojado", "Apagado"]
default = "Charcos y mojado"

[[options]]
id = "sombras_penumbra"
name = "Penumbra"
description = "Básica: borde suave fijo. Variable: dura al pie del objeto, difusa lejos de él."
type = "choice"
values = ["Básica", "Variable"]
default = "Variable"

[[options]]
id = "sombras_penumbra_min"
name = "Penumbra mínima"
type = "float"
default = 5.0
min = 0.0
max = 10.0
step = 0.5

[[options]]
id = "sombras_penumbra_max"
name = "Penumbra máxima"
type = "float"
default = 20.0
min = 0.0
max = 40.0
step = 1.0

[[options]]
id = "sombras_muestras"
name = "Muestras del filtro"
type = "int"
default = 8
min = 4
max = 16

[[options]]
id = "sombras_color"
name = "Sombras de color"
description = "El agua y el cristal de colores tiñen la luz que pasa."
type = "bool"
default = true

[[textures]]
id = "atmosfera"
file = "texturas/atmosfera.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "transmitancia"
file = "texturas/transmitancia.png"
filter = "linear"
wrap = "clamp"

# --- Materiales (ids de MaterialInput.material; ver opciones/luz.wgsl) -------------------------

[[materials]]       # hojas: SSS fuerte
id = 1
sprites = ["block/*_leaves"]

[[materials]]       # plantas cruzadas altas, retoños y algas: SSS fuerte
id = 2
sprites = ["block/*_sapling", "block/tall_grass_*", "block/large_fern_*", "block/sunflower_*", "block/lilac_*", "block/rose_bush_*", "block/peony_*", "block/pitcher_plant_*", "block/kelp", "block/kelp_plant", "block/seagrass", "block/tall_seagrass_*", "block/*_propagule*"]

[[materials]]       # hielo compacto: SSS fuerte
id = 3
sprites = ["block/packed_ice", "block/blue_ice"]

[[materials]]       # hierba, helechos, flores, bambú, lianas: SSS medio, cruzadas
id = 4
sprites = ["block/short_grass", "block/grass", "block/fern", "block/dandelion", "block/poppy", "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower", "block/bamboo_stage0", "block/bamboo_*_leaves", "block/vine", "block/*_vines", "block/*_vines_plant", "block/*_roots", "block/sugar_cane", "block/sweet_berry_bush_*", "block/dead_bush", "block/*_fungus", "block/hanging_roots", "block/cave_vines*"]

[[materials]]       # liquen, pétalos, cogollos de amatista: SSS medio
id = 5
sprites = ["block/glow_lichen", "block/pink_petals*", "block/*_amethyst_bud", "block/amethyst_cluster", "block/moss_carpet"]

[[materials]]       # nieve, amatista, telaraña, coral, champiñón: SSS débil
id = 6
sprites = ["block/snow", "block/powder_snow", "block/amethyst_block", "block/cobweb", "block/*coral*", "block/*_mushroom_block", "block/mushroom_block_inside", "block/mushroom_stem"]

# --- Menú -----------------------------------------------------------------------------------

[[pages]]
id = "principal"
name = "Vulpe"
items = ["page:cielo", "page:fractal", "page:luz", "page:sombras", "page:imagen", "page:depuracion"]

[[pages]]
id = "cielo"
name = "Cielo"
description = "Atmósfera, sol, luna y estrellas."
items = ["cielo_brillo", "cielo_bruma", "sol_temperatura", "luna_brillo", "estrellas", "estrellas_brillo"]

[[pages]]
id = "fractal"
name = "Cielo fractal"
description = "Las constelaciones de fractales de la noche."
items = ["fractal", "fractal_cambios_noche", "fractal_cobertura", "fractal_conjuntos", "fractal_semilla", "fractal_paleta", "fractal_brillo", "fractal_techo", "fractal_saturacion", "fractal_contraste", "fractal_mutacion", "fractal_hueco", "fractal_dibujo"]

[[pages]]
id = "luz"
name = "Luz"
description = "Cielo, bloques, dispersión, brillos y charcos."
items = ["luz_cielo", "luz_bloque", "luz_bloque_color", "luz_minima_cuevas", "luz_minima_exterior", "sss", "sss_brillo", "especular_sol", "emision_labpbr", "charcos"]

[[pages]]
id = "sombras"
name = "Sombras"
description = "Penumbra, filtro y sombras de color."
items = ["sombras_penumbra", "sombras_penumbra_min", "sombras_penumbra_max", "sombras_muestras", "sombras_color"]

[[pages]]
id = "imagen"
name = "Imagen"
description = "Exposición, color y mapeo de tonos."
items = ["imagen_exposicion", "imagen_saturacion", "imagen_contraste", "imagen_tonemap", "imagen_tramado"]

[[pages]]
id = "depuracion"
name = "Depuración"
description = "Vistas para comprobar el núcleo."
columns = 1
items = ["depuracion_vista"]

[budget]
gpu_ms = 1.0
